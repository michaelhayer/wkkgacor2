<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide Foto 2:3 • 61 gambar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
            padding: 12px;
        }

        .app {
            width: 100%;
            max-width: 520px;
            background: #151515;
            border-radius: 32px;
            padding: 20px 16px 24px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        /* frame foto rasio 2:3 */
        .photo-frame {
            width: 100%;
            aspect-ratio: 2 / 3;
            background: #1e1e1e;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.2);
            position: relative;
            transition: box-shadow 0.2s;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.15s ease;
        }

        /* indikator loading (opsional, muncul saat preload) */
        .preload-status {
            position: absolute;
            bottom: 8px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: #ffd966;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .preload-status.show {
            opacity: 1;
        }

        /* info & kontrol */
        .info-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ddd;
            font-size: 0.9rem;
            padding: 0 6px;
        }

        .counter {
            background: #2a2a2a;
            padding: 6px 14px;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #f0e6d2;
            border: 1px solid #3a3a3a;
        }

        .music-btn {
            background: #2a2a2a;
            border: none;
            color: #f0e6d2;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #4a4a4a;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .music-btn:hover {
            background: #3a3a3a;
            border-color: #ffd966;
        }

        .music-btn.playing {
            background: #3a2e1e;
            border-color: #ffb347;
            color: #ffd966;
        }

        .action-buttons {
            width: 100%;
            display: flex;
            gap: 12px;
            margin-top: 4px;
        }

        .action-buttons button {
            flex: 1;
            background: #222;
            border: 1px solid #3a3a3a;
            color: #eee;
            padding: 14px 0;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.3px;
        }

        .action-buttons button:hover {
            background: #2e2e2e;
            border-color: #ffd966;
            color: #ffd966;
        }

        .action-buttons button:active {
            transform: scale(0.97);
        }

        /* daftar foto */
        .list-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s ease, visibility 0.2s;
            z-index: 1000;
            padding: 16px;
        }

        .list-modal.open {
            visibility: visible;
            opacity: 1;
        }

        .list-container {
            background: #151515;
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            border-radius: 32px;
            padding: 22px 16px 16px;
            border: 1px solid #333;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 6px;
        }

        .list-header h3 {
            color: #f0e6d2;
            font-weight: 500;
            font-size: 1.2rem;
            letter-spacing: 0.3px;
        }

        .close-list {
            background: #2a2a2a;
            border: none;
            color: #ccc;
            font-size: 1.6rem;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1;
            border: 1px solid #444;
        }

        .close-list:hover {
            background: #3a3a3a;
            color: #ffb347;
            border-color: #ffb347;
        }

        .grid-fotos {
            overflow-y: auto;
            padding: 6px 4px 6px 6px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: #444 #1e1e1e;
            flex: 1;
        }

        .grid-fotos::-webkit-scrollbar {
            width: 6px;
        }

        .grid-fotos::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 20px;
        }

        .grid-fotos::-webkit-scrollbar-thumb {
            background: #4a4a4a;
            border-radius: 20px;
        }

        .foto-item {
            aspect-ratio: 2 / 3;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            background: #1e1e1e;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .foto-item:hover {
            border-color: #ffd966;
            transform: scale(1.02);
        }

        .foto-item.active {
            border-color: #ffb347;
            box-shadow: 0 0 0 2px #ffb34766;
        }

        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Frame foto utama 2:3 -->
        <div class="photo-frame">
            <img id="mainImage" src="" alt="Foto utama">
            <div class="preload-status" id="preloadStatus">Memuat…</div>
        </div>

        <!-- Info & tombol musik -->
        <div class="info-bar">
            <span class="counter" id="counterDisplay">1 / 61</span>
            <button class="music-btn" id="musicToggle" title="Putar / Jeda lagu Tongue-Tied">
                <span id="musicLabel">Musik Off</span>
            </button>
        </div>

        <!-- Tombol aksi -->
        <div class="action-buttons">
            <button id="listBtn" title="Lihat daftar semua foto">
                Daftar Foto
            </button>
        </div>
    </div>

    <!-- MODAL DAFTAR FOTO -->
    <div class="list-modal" id="listModal">
        <div class="list-container">
            <div class="list-header">
                <h3>Semua Foto</h3>
                <button class="close-list" id="closeListBtn">&times;</button>
            </div>
            <div class="grid-fotos" id="fotoGrid"></div>
        </div>
    </div>

    <!-- AUDIO ELEMENT -->
    <audio id="bgMusic" src="Tongue-Tied.mp3" loop preload="auto"></audio>

    <script>
        (function() {
            // ================= KONFIGURASI =================
            const TOTAL_FOTOS   = 61;
            const INTERVAL_MS   = 1500;  // ganti foto tiap 1.5 detik
            const PRELOAD_CONCURRENT = 6; // jumlah gambar yang dimuat paralel

            // ================= DAFTAR FILE =================
            const fotoFiles = [];
            for (let i = 1; i <= TOTAL_FOTOS; i++) {
                const num = i.toString().padStart(3, '0');
                fotoFiles.push(`wkk-${num}.webp`);
            }

            // ================= DOM =================
            const mainImage      = document.getElementById('mainImage');
            const counterDisplay = document.getElementById('counterDisplay');
            const musicToggle    = document.getElementById('musicToggle');
            const musicLabel     = document.getElementById('musicLabel');
            const bgMusic        = document.getElementById('bgMusic');
            const listBtn        = document.getElementById('listBtn');
            const listModal      = document.getElementById('listModal');
            const closeListBtn   = document.getElementById('closeListBtn');
            const fotoGrid       = document.getElementById('fotoGrid');
            const preloadStatus  = document.getElementById('preloadStatus');

            // ================= STATE =================
            let currentIndex   = 0;
            let autoInterval   = null;
            let isPlayingMusic = false;
            let isModalOpen    = false;

            // ================= CACHE / PRELOAD =================
            // Menyimpan objek Image() yang sudah dimuat ke memori.
            // Selama halaman tidak di-refresh, gambar tidak akan dimuat ulang
            // karena browser sudah menyimpannya di cache memori + HTTP cache.
            const imageCache = new Array(TOTAL_FOTOS).fill(null);
            let loadedCount   = 0;

            function updatePreloadStatus() {
                if (loadedCount >= TOTAL_FOTOS) {
                    preloadStatus.classList.remove('show');
                } else {
                    preloadStatus.textContent = `Memuat ${loadedCount}/${TOTAL_FOTOS}`;
                    preloadStatus.classList.add('show');
                }
            }

            // Preload semua gambar secara bertahap (paralel terbatas)
            function preloadAllImages() {
                let nextIndex = 0;

                function loadNext() {
                    if (nextIndex >= TOTAL_FOTOS) return;
                    const idx = nextIndex++;
                    const img = new Image();

                    img.onload = img.onerror = () => {
                        imageCache[idx] = img;
                        loadedCount++;
                        updatePreloadStatus();
                        loadNext(); // lanjut ke berikutnya
                    };

                    // decode() agar gambar siap dirender tanpa jeda
                    img.src = fotoFiles[idx];
                    if (img.decode) {
                        img.decode().catch(() => {});
                    }
                }

                // Jalankan beberapa worker paralel
                const workers = Math.min(PRELOAD_CONCURRENT, TOTAL_FOTOS);
                for (let w = 0; w < workers; w++) {
                    loadNext();
                }
                updatePreloadStatus();
            }

            // Ambil gambar dari cache (instan). Jika belum selesai dimuat,
            // tetap pakai path file — browser akan menampilkan dari cache HTTP.
            function getCachedImage(index) {
                const cached = imageCache[index];
                if (cached && cached.complete && cached.src) {
                    return cached.src;
                }
                return fotoFiles[index];
            }

            // ================= GANTI FOTO =================
            function loadImageByIndex(index) {
                if (index < 0 || index >= TOTAL_FOTOS) return;
                const newSrc = getCachedImage(index);

                // Hanya update kalau src berbeda (hindari reload tak perlu)
                if (mainImage.src !== newSrc) {
                    // transisi halus: fade out → ganti → fade in
                    mainImage.style.opacity = '0';
                    setTimeout(() => {
                        mainImage.src = newSrc;
                        mainImage.alt = `Foto ${index + 1}`;
                        mainImage.style.opacity = '1';
                    }, 80);
                }

                currentIndex = index;
                counterDisplay.textContent = `${currentIndex + 1} / ${TOTAL_FOTOS}`;
                if (isModalOpen) highlightActiveThumbnail(index);
            }

            function highlightActiveThumbnail(activeIdx) {
                document.querySelectorAll('.foto-item').forEach((item, idx) => {
                    item.classList.toggle('active', idx === activeIdx);
                });
            }

            function startAutoSlide() {
                if (autoInterval) clearInterval(autoInterval);
                autoInterval = setInterval(() => {
                    loadImageByIndex((currentIndex + 1) % TOTAL_FOTOS);
                }, INTERVAL_MS);
            }

            // ================= MUSIK =================
            function updateMusicUI() {
                if (isPlayingMusic) {
                    musicLabel.textContent = '🔊 Musik On';
                    musicToggle.classList.add('playing');
                } else {
                    musicLabel.textContent = '🔇 Musik Off';
                    musicToggle.classList.remove('playing');
                }
            }

            function safeToggleMusic() {
                if (isPlayingMusic) {
                    bgMusic.pause();
                    isPlayingMusic = false;
                    updateMusicUI();
                } else {
                    const playPromise = bgMusic.play();
                    if (playPromise !== undefined) {
                        playPromise.then(() => {
                            isPlayingMusic = true;
                            updateMusicUI();
                        }).catch(error => {
                            console.warn('Audio play error:', error);
                            isPlayingMusic = false;
                            updateMusicUI();
                        });
                    } else {
                        bgMusic.play();
                        isPlayingMusic = true;
                        updateMusicUI();
                    }
                }
            }

            // ================= MODAL DAFTAR FOTO =================
            function buildPhotoGrid() {
                fotoGrid.innerHTML = '';
                fotoFiles.forEach((file, idx) => {
                    const item = document.createElement('div');
                    item.className = 'foto-item' + (idx === currentIndex ? ' active' : '');
                    item.dataset.index = idx;

                    const img = document.createElement('img');
                    // pakai cache jika tersedia
                    img.src = getCachedImage(idx);
                    img.alt = `Foto ${idx + 1}`;
                    img.loading = 'lazy';
                    item.appendChild(img);

                    item.addEventListener('click', () => {
                        loadImageByIndex(idx);
                    });

                    fotoGrid.appendChild(item);
                });
            }

            function openModal() {
                buildPhotoGrid();
                listModal.classList.add('open');
                isModalOpen = true;
            }

            function closeModal() {
                listModal.classList.remove('open');
                isModalOpen = false;
            }

            // ================= EVENT =================
            musicToggle.addEventListener('click', safeToggleMusic);
            listBtn.addEventListener('click', openModal);
            closeListBtn.addEventListener('click', closeModal);

            listModal.addEventListener('click', (e) => {
                if (e.target === listModal) closeModal();
            });

            window.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isModalOpen) closeModal();
            });

            // ================= INIT =================
            function init() {
                // 1) Preload semua gambar ke cache
                preloadAllImages();

                // 2) Tampilkan foto pertama segera (dari file langsung)
                mainImage.src = fotoFiles[0];
                mainImage.alt = 'Foto 1';
                mainImage.style.opacity = '1';
                counterDisplay.textContent = `1 / ${TOTAL_FOTOS}`;

                // 3) Mulai auto slide
                startAutoSlide();

                // 4) Musik
                isPlayingMusic = false;
                updateMusicUI();
                bgMusic.volume = 0.7;
            }

            init();

            // Tangani error gambar
            mainImage.addEventListener('error', function() {
                console.warn('Gambar gagal dimuat:', mainImage.src);
            });
        })();
    </script>
</body>
</html>
